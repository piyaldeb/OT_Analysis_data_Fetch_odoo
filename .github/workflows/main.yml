name: Odoo OT & PO Reports

on:
  workflow_dispatch:
    inputs:
      script_choice:
        description: 'Select script to run'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Ot_data_fetch.py
          - purchase_orders.py

      from_date:
        description: 'Start date (YYYY-MM-DD) [ignored, fixed to March 1st of current year]'
        required: false
        default: ''

      to_date:
        description: 'End date (YYYY-MM-DD) [ignored, always yesterday]'
        required: false
        default: ''

  schedule:
    - cron: '0 1 * * *'      # 7:00 AM Dhaka
    - cron: '30 1 * * *'     # 7:30 AM Dhaka
    - cron: '0 3 * * *'      # 9:00 AM Dhaka
    - cron: '0 5 * * *'      # 11:00 AM Dhaka

jobs:
  run_reports:
    runs-on: ubuntu-latest

    env:
      ODOO_URL: ${{ secrets.ODOO_URL }}
      USERNAME: ${{ secrets.ODOO_USERNAME }}
      PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install gspread oauth2client gspread_dataframe pytz requests

      - name: Decode Google Service Account
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          if echo "$GOOGLE_CREDS_JSON" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "$GOOGLE_CREDS_JSON" > gcreds.json
            echo "Using raw JSON credentials."
          else
            echo "$GOOGLE_CREDS_B64" | base64 --decode > gcreds.json
            echo "Using base64-decoded credentials."
          fi

      - name: Determine script to run and dates
        id: script
        run: |
          # Determine selected script
          if [ "${{ github.event.inputs.script_choice }}" = "" ]; then
            SCRIPT="All"
          else
            SCRIPT="${{ github.event.inputs.script_choice }}"
          fi

          echo "script=$SCRIPT" >> $GITHUB_OUTPUT

          # Fixed FROM_DATE = April 1st of current year
          # (March is skipped because Odoo OT Analysis report crashes
          # on a duplicate-attendance edge case around March 12.)
          FROM_DATE=$(date +'%Y-04-01')
          echo "FROM_DATE=$FROM_DATE" >> $GITHUB_ENV

          # Fixed TO_DATE = yesterday
          TO_DATE=$(date -d 'yesterday' +'%Y-%m-%d')
          echo "TO_DATE=$TO_DATE" >> $GITHUB_ENV

          # Determine if all scripts should run
          if [ "$SCRIPT" = "All" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
          else
            echo "run_all=false" >> $GITHUB_OUTPUT
          fi

      - name: Run OT Data Fetch
        if: steps.script.outputs.script == 'Ot_data_fetch.py' || steps.script.outputs.run_all == 'true'
        run: |
          echo "Running OT Data Fetch from $FROM_DATE to $TO_DATE"
          python Ot_data_fetch.py --from_date $FROM_DATE --to_date $TO_DATE

      - name: Run Purchase Orders Fetch
        if: steps.script.outputs.script == 'purchase_orders.py' || steps.script.outputs.run_all == 'true'
        run: |
          echo "Running Purchase Orders Fetch from $FROM_DATE to $TO_DATE"
          python purchase_orders.py --from_date $FROM_DATE --to_date $TO_DATE
